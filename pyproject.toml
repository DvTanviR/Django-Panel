[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deploydjango"
version = "0.1.0"
description = "Self-hosted Django PaaS"
requires-python = ">=3.12"
dependencies = [
    "django>=4.2,<5.0",
    "djangorestframework>=3.14,<3.15",
    "django-cryptography>=1.1,<2.0",
    "celery>=5.3,<6.0",
    "redis>=5.0,<6.0",
    "docker>=7.0,<8.0",
    "python-dotenv>=1.0,<2.0",
    "dnspython>=2.4,<3.0",
    "cryptography>=41.0,<42.0",
    "gunicorn>=21.2,<22.0",
    "psycopg2-binary>=2.9,<3.0",
]
